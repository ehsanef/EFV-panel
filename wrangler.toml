name = "efv-panel"
main = "dist/worker.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# UUID = ""       # optional: pre-seed VLESS UUID (auto-generated on first run if empty)
# TR_PASS = ""    # optional: pre-seed Trojan password (auto-generated on first run if empty)

# KV binding — auto-provisioned:
#  • `wrangler deploy` (v4+): no `id` needed; the namespace is created & bound on first deploy
#  • Deploy Button: Cloudflare rewrites the id in your clone during install
[[kv_namespaces]]
binding = "kv"
