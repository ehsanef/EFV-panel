<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>EFV Panel</title>
<style>/* CSS_PLACEHOLDER */</style>
</head>
<body>
<div class="layout">

    <button class="nav-toggle" id="navToggle" aria-label="Menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>

    <aside class="sidebar" id="sidebar">
        <div class="brand">
            <span class="brand-mark">⚡</span>
            <span class="brand-name">EFV<em>panel</em></span>
        </div>

        <nav class="nav" id="nav">
            <button class="nav-item active" data-section="home">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/></svg>
                <span data-i18n="nav_home">Home</span>
            </button>
            <button class="nav-item" data-section="subs">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h10M4 18h13"/></svg>
                <span data-i18n="nav_subs">Subscriptions</span>
            </button>
            <button class="nav-item" data-section="proxy">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>
                <span data-i18n="nav_proxy">Proxy</span>
            </button>
            <button class="nav-item" data-section="fragment">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 12h4l2-6 3 12 2-6h5"/></svg>
                <span data-i18n="nav_fragment">Fragment</span>
            </button>
            <button class="nav-item" data-section="dns">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="5" r="2.2"/><circle cx="5" cy="19" r="2.2"/><circle cx="19" cy="19" r="2.2"/><path d="M12 7.2v4.3m0 0-5.5 5m5.5-5 5.5 5"/></svg>
                <span data-i18n="nav_dns">DNS</span>
            </button>
            <button class="nav-item" data-section="routing">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="6" r="2.2"/><circle cx="19" cy="18" r="2.2"/><circle cx="5" cy="18" r="2.2"/><path d="M7.2 6h6.3a3 3 0 0 1 3 3v6.8M7.2 18h3"/></svg>
                <span data-i18n="nav_routing">Routing</span>
            </button>
            <button class="nav-item" data-section="cdn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3v4m0 10v4M3 12h4m10 0h4"/><circle cx="12" cy="12" r="4.5"/></svg>
                <span data-i18n="nav_cdn">CDN &amp; IPs</span>
            </button>
            <button class="nav-item" data-section="warp">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17c4-9 14-9 18 0"/><path d="M7 14c2.5-5 7.5-5 10 0"/><circle cx="12" cy="18" r="1.6" fill="currentColor" stroke="none"/></svg>
                <span data-i18n="nav_warp">WARP</span>
            </button>
            <button class="nav-item" data-section="custom">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m0 8v3a2 2 0 0 0 2 2h3m8 0h3a2 2 0 0 0 2-2v-3m0-8V5a2 2 0 0 0-2-2h-3"/><path d="M9 9h6M9 15h6"/></svg>
                <span data-i18n="nav_custom">Custom</span>
            </button>
            <button class="nav-item danger" data-section="danger">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2.5 20h19L12 3z"/><path d="M12 9v5m0 3v.01"/></svg>
                <span data-i18n="nav_danger">Danger Zone</span>
            </button>
        </nav>

        <div class="sidebar-footer">
            <button class="ghost-btn" id="logoutBtn" data-i18n="logout">Sign out</button>
        </div>
    </aside>

    <div class="scrim" id="scrim"></div>

    <div class="content">
        <header class="topbar">
            <div class="topbar-left">
                <span class="ip-chip mono" id="ipChip" title="My IP">IP ···</span>
            </div>
            <div class="topbar-right">
                <span class="ver-badge mono">v<span id="verNum">__VERSION__</span></span>
                <button class="icon-btn" id="langToggle" aria-label="Language">فارسی</button>
                <button class="icon-btn" id="themeToggle" aria-label="Theme">
                    <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2m0 15v2M2.5 12h2m15 0h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/></svg>
                </button>
            </div>
        </header>

        <main id="main" class="main">
            <div class="boot" id="boot">
                <span class="boot-pulse"></span>
                <span data-i18n="loading">Loading…</span>
            </div>
        </main>
    </div>
</div>

<div class="savebar" id="savebar" hidden>
    <span class="dirty-dot" id="dirtyDot" aria-hidden="true"></span>
    <span class="savebar-label" id="dirtyLabel" data-i18n="unsaved">Unsaved changes</span>
    <button class="btn ghost" id="resetBtn" data-i18n="reset_defaults">Defaults</button>
    <button class="btn primary" id="saveBtn" data-i18n="save">Save</button>
</div>

<div class="modal" id="qrModal" hidden>
    <div class="modal-card">
        <button class="modal-x" id="qrClose" aria-label="Close">×</button>
        <h3 id="qrTitle" class="mono">QR</h3>
        <img id="qrImg" alt="QR code" width="220" height="220">
        <p class="modal-hint mono" id="qrHint"></p>
    </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script>/* JS_PLACEHOLDER */</script>
</body>
</html>
